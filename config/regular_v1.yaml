# =============================================================================
# 常规量价模拟盘 v1.0 —— 标准参数表
# 对应文档：docs/03_常规版_量价择时系统_v1.0.md
#
# 设计原则：
#   1. 代码只通过 "模块.对象.指标" 形式的 id 读取参数，不在代码里写死阈值。
#   2. 每个参数都有单位、允许区间、敏感度、对应口诀，方便复盘时只改一个。
#   3. tunable: false 的是结构/执行假设，不是“懒得调”，而是改了就不再是同一套系统。
#   4. 所有 pct 都是小数：0.05 = 5%；x 是倍数：1.5 = 1.5 倍；day 是交易日。
#
# 调参纪律（与打板盘一致）：
#   - 每季度最多改 1 个参数，且必须有改前/改后假设与样本。
#   - 回撤期禁止调参；先判断是“规则失效”还是“风格不适”。
#   - 优先改 sensitivity: high 的择时/量价参数，不要一次改多个。
# =============================================================================

meta:
  system: regular_paper
  name: "常规量价模拟盘"
  version: "1.1.0"
  updated: "2026-11-12"
  market: A_SHARE
  timeframe: 1d
  execution: next_open
  description: >
    以“买横买坑、不买竖”为选股骨架，以“人声鼎沸/连续大涨/冲高回落/放量急跌”
    为卖出梯度，用市场温度做总仓位门控的日线级常规波段模拟盘。
  conventions:
    pct: "小数，0.05 = 5%"
    x: "倍数，1.5 = 1.5 倍"
    day: "交易日"
    score: "0-100 分"
  profiles: [defensive, balanced, offensive]
  # 第一线参数：复盘时优先只动这些，其余二线/冻结参数不要和它们一起改
  tuning_priority:
    - timing.cold_heat
    - timing.trend_heat
    - timing.hot_heat
    - timing.cap_trend
    - timing.cap_hot
    - timing.crash_day
    - timing.crash_vol
    - selection.pit_min_depth
    - selection.pit_max_depth
    - selection.pit_vol_max
    - selection.deep_pit_depth
    - selection.vertical_ret5
    - selection.vertical_ma20_dist
    - selection.min_score
    - entry.gap_max
    - entry.stop_loss
    - entry.size_mult_deep_pit
    - entry.size_mult_cold_deep_pit
    - portfolio.cold_max_positions
    - holding.washout_vol
    - holding.climax_big_up_days
    - holding.trail_pct
    - exit.volume_dump_vol
    - portfolio.risk_per_trade
    - portfolio.max_weight

# -----------------------------------------------------------------------------
# 风险档位：只覆盖 tunable 参数；不改变规则结构
# -----------------------------------------------------------------------------
profiles:
  defensive:
    description: "低风险：单笔风险 0.8%，趋势仓上限 70%，只做高分信号"
    overrides:
      portfolio.risk_per_trade: 0.008
      portfolio.max_weight: 0.22
      portfolio.max_portfolio_heat: 0.035
      timing.cap_trend: 0.70
      timing.cap_hot: 0.30
      entry.stop_loss: 0.06
      selection.min_score: 65
      exit.volume_dump_vol: 1.30
  balanced:
    description: "基准档：默认参数，不做覆盖"
    overrides: {}
  offensive:
    description: "高风险：单笔风险 1.8%，允许更高趋势仓，接受更大回撤"
    overrides:
      portfolio.risk_per_trade: 0.018
      portfolio.max_weight: 0.32
      portfolio.max_portfolio_heat: 0.070
      timing.cap_trend: 1.00
      timing.cap_hot: 0.50
      selection.min_score: 55
      holding.trail_start: 0.12

# =============================================================================
# 一、股票池：先排除“不能做/不值得做”的票
# =============================================================================
parameters:

  universe.min_price:
    value: 2.0
    unit: yuan
    range: [1.0, 10.0]
    step: 0.5
    tunable: false
    sensitivity: medium
    group: universe
    aphorism: "不挖深坑不大买"
    note: "低于 2 元的面值风险/仙股，尾部风险不对称。"

  universe.min_float_mv:
    value: 3000000000.0
    unit: yuan
    range: [500000000.0, 30000000000.0]
    step: 500000000.0
    tunable: true
    sensitivity: medium
    group: universe
    aphorism: "不挖深坑不大买"
    note: "流通市值 30 亿以下，承接与流动性不足，深坑容易变成无底洞。"

  universe.min_amount_20d:
    value: 100000000.0
    unit: yuan
    range: [20000000.0, 1000000000.0]
    step: 10000000.0
    tunable: true
    sensitivity: high
    group: universe
    aphorism: "急跌放量立马撤"
    note: "20 日平均成交额低于 1 亿，放量/无量的判断都不可靠，滑点也会吃掉边际。"

  universe.max_scan:
    value: 300
    unit: count
    range: [100, 800]
    step: 50
    tunable: true
    sensitivity: high
    group: universe
    aphorism: "买横买坑"
    note: "每日按成交额取前 N 只做全量日线扫描。N 越大越全，但首次拉取越慢。"

  universe.min_history_days:
    value: 120
    unit: day
    range: [80, 250]
    step: 10
    tunable: false
    sensitivity: low
    group: universe
    aphorism: "不挖深坑不大买"
    note: "至少 120 根日线，才能同时算 MA60、60 日高点与 20 日平台。"

  universe.exclude_st:
    value: true
    unit: bool
    tunable: false
    sensitivity: low
    group: universe
    aphorism: "制度"
    note: "ST/*ST 涨跌幅 5%，价格行为与常规票不可比。"

  universe.exclude_bse:
    value: true
    unit: bool
    tunable: false
    sensitivity: low
    group: universe
    aphorism: "制度"
    note: "北交所流动性不足，默认不做。"

  universe.exclude_limit_up_today:
    value: true
    unit: bool
    tunable: false
    sensitivity: low
    group: universe
    aphorism: "不买竖"
    note: "当日已涨停的票不进入次日开盘候选，避免把‘竖’当成‘横’。"

# =============================================================================
# 二、择时：市场温度 → 状态 → 总仓位上限
# 口诀映射：卖在人声鼎沸处 / 急跌无量是洗盘 / 急跌放量立马撤
# =============================================================================
  timing.index_symbol:
    value: "000300"
    unit: code
    choices: ["000300", "000905", "000852", "000985"]
    tunable: false
    sensitivity: low
    group: timing
    aphorism: "择时"
    note: "基准指数。默认沪深 300；换指数等于换择时口径，不要中途随意换。"

  timing.ma_fast:
    value: 20
    unit: day
    range: [10, 30]
    step: 1
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "买横买坑，不买竖"
    note: "短期趋势线。越大越迟钝，越小越容易被洗。"

  timing.ma_slow:
    value: 60
    unit: day
    range: [40, 120]
    step: 5
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "不挖深坑不大买"
    note: "长期趋势线。深坑能否大买，先看指数和个股是否仍在 MA60 之上。"

  timing.slope_window:
    value: 5
    unit: day
    range: [3, 10]
    step: 1
    tunable: false
    sensitivity: medium
    group: timing
    aphorism: "连续小涨要大涨"
    note: "斜率窗口。用 5 日变化判断 MA20/MA60 是走平、上翘还是下压。"

  timing.vol_window:
    value: 20
    unit: day
    range: [10, 40]
    step: 5
    tunable: false
    sensitivity: medium
    group: timing
    aphorism: "急跌放量立马撤"
    note: "量能基准窗口。放量/无量都相对这个窗口的均值来判断。"

  timing.weight_trend:
    value: 0.30
    unit: weight
    range: [0.0, 1.0]
    step: 0.05
    tunable: false
    sensitivity: high
    group: timing
    aphorism: "择时"
    note: "趋势分权重。五个权重之和必须为 1.0。"

  timing.weight_breadth:
    value: 0.25
    unit: weight
    range: [0.0, 1.0]
    step: 0.05
    tunable: false
    sensitivity: high
    group: timing
    aphorism: "卖在人声鼎沸处"
    note: "市场宽度权重。宽度极端高时，往往就是‘人声鼎沸’。"

  timing.weight_momentum:
    value: 0.20
    unit: weight
    range: [0.0, 1.0]
    step: 0.05
    tunable: false
    sensitivity: high
    group: timing
    aphorism: "连续小涨要大涨"
    note: "指数 20 日动量权重。"

  timing.weight_volume:
    value: 0.15
    unit: weight
    range: [0.0, 1.0]
    step: 0.05
    tunable: false
    sensitivity: high
    group: timing
    aphorism: "急跌放量立马撤"
    note: "指数成交额/20 日均值权重。"

  timing.weight_up:
    value: 0.10
    unit: weight
    range: [0.0, 1.0]
    step: 0.05
    tunable: false
    sensitivity: high
    group: timing
    aphorism: "卖在人声鼎沸处"
    note: "上涨家数占比权重。"

  timing.cold_heat:
    value: 30
    unit: score
    range: [10, 45]
    step: 1
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "买横买坑"
    note: "低于此温度进入冰点：只留底仓，不开新仓。"

  timing.trend_heat:
    value: 55
    unit: score
    range: [40, 70]
    step: 1
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "连续小涨要大涨"
    note: "达到此温度且指数在 MA20 上方、MA60 上翘，进入趋势状态。"

  timing.hot_heat:
    value: 75
    unit: score
    range: [60, 90]
    step: 1
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "卖在人声鼎沸处"
    note: "达到此温度进入过热：仓位上限下调、停止开新仓。"

  timing.crash_day:
    value: 0.03
    unit: pct
    range: [0.015, 0.06]
    step: 0.005
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "急跌放量立马撤"
    note: "指数单日跌幅达到此值，进入急跌状态。"

  timing.crash_ret5:
    value: 0.06
    unit: pct
    range: [0.03, 0.12]
    step: 0.01
    tunable: false
    sensitivity: medium
    group: timing
    aphorism: "急跌放量立马撤"
    note: "指数 5 日累计跌幅达到此值，且放量，进入急跌状态。"

  timing.crash_vol:
    value: 1.20
    unit: x
    range: [1.0, 2.0]
    step: 0.1
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "急跌放量立马撤"
    note: "急跌判定所需的指数成交额放大倍数。低于此值视为缩量洗盘。"

  timing.hot_extension:
    value: 0.08
    unit: pct
    range: [0.04, 0.15]
    step: 0.01
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "卖在人声鼎沸处"
    note: "指数偏离 MA20 超过此值，即使温度不高也按过热处理。"

  timing.hot_ret20:
    value: 0.15
    unit: pct
    range: [0.08, 0.30]
    step: 0.01
    tunable: false
    sensitivity: high
    group: timing
    aphorism: "连续大涨要离场"
    note: "指数 20 日涨幅达到此值，按下过热处理。"

  timing.washout_day:
    value: 0.02
    unit: pct
    range: [0.01, 0.04]
    step: 0.005
    tunable: false
    sensitivity: high
    group: timing
    aphorism: "急跌无量是洗盘"
    note: "指数单日跌幅达到此值但缩量，视为洗盘而不是崩盘。"

  timing.washout_vol:
    value: 0.80
    unit: x
    range: [0.5, 1.0]
    step: 0.05
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "急跌无量是洗盘"
    note: "缩量阈值。指数急跌且成交额低于 20 日均值的这个倍数，不切急跌状态。"

  timing.market_climax_heat:
    value: 85
    unit: score
    range: [75, 95]
    step: 1
    tunable: false
    sensitivity: high
    group: timing
    aphorism: "卖在人声鼎沸处"
    note: "人声鼎沸的极端温度：除停止开仓外，盈利持仓减半。"

  timing.hysteresis:
    value: 5
    unit: score
    range: [2, 10]
    step: 1
    tunable: false
    sensitivity: medium
    group: timing
    aphorism: "择时"
    note: "状态迟滞带宽，防止温度在阈值附近来回跳。"

  timing.min_dwell:
    value: 2
    unit: day
    range: [1, 5]
    step: 1
    tunable: false
    sensitivity: medium
    group: timing
    aphorism: "择时"
    note: "最小驻留天数。急跌/过热可立即切换，其余状态至少驻留 2 日。"

  timing.cap_cold:
    value: 0.20
    unit: weight
    range: [0.0, 0.5]
    step: 0.05
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "买横买坑"
    note: "冰点总仓位上限。"

  timing.cap_repair:
    value: 0.50
    unit: weight
    range: [0.2, 0.8]
    step: 0.05
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "买横买坑"
    note: "修复期总仓位上限。"

  timing.cap_trend:
    value: 0.90
    unit: weight
    range: [0.4, 1.0]
    step: 0.05
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "连续小涨要大涨"
    note: "趋势期总仓位上限。"

  timing.cap_hot:
    value: 0.40
    unit: weight
    range: [0.0, 0.7]
    step: 0.05
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "卖在人声鼎沸处"
    note: "过热期总仓位上限。过热期只减不加。"

  timing.cap_crash:
    value: 0.00
    unit: weight
    range: [0.0, 0.3]
    step: 0.05
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "急跌放量立马撤"
    note: "急跌期总仓位上限。默认清仓。"

  timing.cold_deep_pit_enabled:
    value: true
    unit: bool
    tunable: true
    sensitivity: high
    group: timing
    aphorism: "不挖深坑不大买"
    note: "冰点期是否放行“深坑”形态。放行时也只允许深坑，不允许横盘/小涨；默认最多 1 只、风险预算减半。"

# =============================================================================
# 三、选股：横 / 坑 / 小涨 / 竖的排除
# =============================================================================
  selection.platform_window:
    value: 20
    unit: day
    range: [10, 40]
    step: 5
    tunable: false
    sensitivity: high
    group: selection
    aphorism: "买横"
    note: "平台箱体的回看窗口。"

  selection.platform_max_range:
    value: 0.12
    unit: pct
    range: [0.06, 0.20]
    step: 0.01
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "买横"
    note: "箱体最大振幅（高/低-1）。越紧越像横盘。"

  selection.platform_vol_max:
    value: 0.90
    unit: x
    range: [0.6, 1.2]
    step: 0.05
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "买横"
    note: "5 日均量 / 20 日均量低于此值，视为横盘缩量。"

  selection.platform_ma60_buffer:
    value: 0.02
    unit: pct
    range: [0.0, 0.08]
    step: 0.01
    tunable: false
    sensitivity: medium
    group: selection
    aphorism: "不挖深坑不大买"
    note: "收盘价不低于 MA60 的 (1-buffer)，避免在长期趋势下方接横盘。"

  selection.platform_edge_buffer:
    value: 0.02
    unit: pct
    range: [0.0, 0.06]
    step: 0.005
    tunable: false
    sensitivity: medium
    group: selection
    aphorism: "买横"
    note: "箱体上下沿的容差：收盘在箱体内（含 2% 容差）才买，突破太多不追。"

  selection.pit_lookback:
    value: 10
    unit: day
    range: [5, 25]
    step: 1
    tunable: false
    sensitivity: high
    group: selection
    aphorism: "买坑"
    note: "坑的回看窗口：在最近 N 日里找‘高点→低点’的急跌。"

  selection.pit_min_depth:
    value: 0.12
    unit: pct
    range: [0.06, 0.20]
    step: 0.01
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "买坑"
    note: "浅坑下限。小于这个跌幅不算坑。"

  selection.pit_max_depth:
    value: 0.35
    unit: pct
    range: [0.22, 0.50]
    step: 0.01
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "买坑"
    note: "深坑上限。超过这个跌幅更像趋势破坏，不是洗盘。"

  selection.pit_vol_max:
    value: 0.90
    unit: x
    range: [0.6, 1.2]
    step: 0.05
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "急跌无量是洗盘"
    note: "下跌段平均量 / 20 日均量低于此值，才承认是‘无量坑’。放量下跌不买。"

  selection.deep_pit_depth:
    value: 0.25
    unit: pct
    range: [0.18, 0.35]
    step: 0.01
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "不挖深坑不大买"
    note: "深坑阈值。达到此深度且趋势未坏，才允许放大单笔风险。"

  selection.vertical_ret5:
    value: 0.12
    unit: pct
    range: [0.08, 0.20]
    step: 0.01
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "不买竖"
    note: "5 日涨幅达到此值，视为竖，直接排除。"

  selection.vertical_ret10:
    value: 0.20
    unit: pct
    range: [0.12, 0.40]
    step: 0.02
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "不买竖"
    note: "10 日涨幅达到此值，视为竖，直接排除。"

  selection.vertical_ma20_dist:
    value: 0.10
    unit: pct
    range: [0.05, 0.20]
    step: 0.01
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "不买竖"
    note: "收盘价高于 MA20 超过此值，视为偏离过大，不追。"

  selection.vertical_big_up_days:
    value: 2
    unit: day
    range: [1, 3]
    step: 1
    tunable: false
    sensitivity: high
    group: selection
    aphorism: "连续大涨要离场"
    note: "最近 3 日出现 N 根大阳线（≥4%），视为加速末端，不买。"

  selection.small_rise_window:
    value: 5
    unit: day
    range: [3, 8]
    step: 1
    tunable: false
    sensitivity: high
    group: selection
    aphorism: "连续小涨要大涨"
    note: "小涨序列的观察窗口。"

  selection.small_rise_min:
    value: 0.002
    unit: pct
    range: [0.0, 0.01]
    step: 0.001
    tunable: false
    sensitivity: high
    group: selection
    aphorism: "连续小涨要大涨"
    note: "单日小涨下限。太小可能是横盘噪声。"

  selection.small_rise_max:
    value: 0.030
    unit: pct
    range: [0.015, 0.05]
    step: 0.005
    tunable: true
    sensitivity: high
    group: selection
    aphorism: "连续小涨要大涨"
    note: "单日小涨上限。超过此值算大阳线，不属于‘缓步推升’。"
  selection.small_rise_cum_min:
    value: 0.02
    unit: pct
    range: [0.01, 0.05]
    step: 0.005
