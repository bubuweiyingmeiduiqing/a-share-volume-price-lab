# =============================================================================
# 运行时（不属于策略调参；部署时按机器改）
# =============================================================================
runtime:
  data:
    cache_dir: "cache"
    history_days: 180
    index_history_days: 260
    fetch_workers: 4
    spot_cache_minutes: 60
    # 收盘后指数日线接口还没更新时，用实时行情补当日 K 线（否则整轮收盘直接 DataError）
    index_realtime_fill: true
  push:
    enabled: true
    premarket_heartbeat: true
    close_always: true
    title_prefix: "常规量价模拟盘"
    timeout_sec: 10
    tokens: []
  execution:
    mode: "next_open"
    t_plus_one: true
    limit_down_unsellable: true
  review:
    enabled: true
    # 每 5 次“收盘推送”做一次复盘；09:15 盘前心跳不计入，避免 2.5 天就复盘一次
    every_n_close_pushes: 5
    # 少于 30 笔已平仓样本时，只记录、不调参
    min_trades_for_param_change: 30
